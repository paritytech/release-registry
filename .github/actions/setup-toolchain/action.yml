name: Set up toolchain
description: >-
  Installs what `just` needs to regenerate the derived files: the system
  libraries Pillow builds against, Python 3.13 with a pip cache keyed on
  scripts/requirements.txt, and just. Shared by the PR check and the
  release-PR workflow so both regenerate files with the same toolchain.

runs:
  using: composite
  steps:
    - name: Install system dependencies for Pillow
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: scripts/requirements.txt

    - name: Set up Just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: 1.35.0
