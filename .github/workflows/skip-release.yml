# Manually triggered workflow that skips a planned release or patch:
# runs `just skip <release>` and opens a PR with the regenerated files.

name: Skip release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release or patch name to skip (e.g. stable2509 or stable2509-7)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  skip-release:
    uses: ./.github/workflows/reusable-release-pr.yml
    with:
      branch: skip-${{ inputs.release }}
      title: Skip ${{ inputs.release }}
      recipes: skip ${{ inputs.release }}
    secrets: inherit
