# Manually triggered workflow that marks a release or patch as released:
# runs `just publish <release> <date>` and opens a PR with the regenerated files.
#
# For a monthly release this one run is the whole monthly routine: it also
# deprecates the monthly release before it and plans new monthly releases, so
# that six stay planned.

name: New release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release or patch name (e.g. stable2612 or stable2609-3)'
        required: true
        type: string
      date:
        description: 'Release date (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  new-release:
    uses: ./.github/workflows/reusable-release-pr.yml
    with:
      branch: release-${{ inputs.release }}
      title: Release ${{ inputs.release }}
      recipes: publish ${{ inputs.release }} ${{ inputs.date }}
    secrets: inherit
