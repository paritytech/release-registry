# Manually triggered workflow that marks a release or patch as released:
# runs `just publish <release> <date>` and opens a PR with the regenerated files.

name: New release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release name (e.g. stable2509-7)'
        required: true
        type: string
      date:
        description: 'Release date (YYYY-MM-DD)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  new-release:
    uses: ./.github/workflows/reusable-release-pr.yml
    with:
      branch: release-${{ inputs.release }}
      title: Release ${{ inputs.release }}
      recipes: publish ${{ inputs.release }} ${{ inputs.date }}
    secrets: inherit
