# Manually triggered workflow that deprecates a release:
# runs `just deprecate <release> <date> <use_instead>` (already released patches
# are deprecated, planned ones are skipped) and opens a PR with the regenerated
# files.

name: Deprecate release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release name to deprecate (e.g. stable2509)'
        required: true
        type: string
      date:
        description: 'Deprecation date (YYYY-MM-DD)'
        required: true
        type: string
      use_instead:
        description: 'Release to use instead (e.g. stable2606)'
        required: true
        type: string

# The called workflow authenticates with RB_TOKEN; GITHUB_TOKEN only needs to read.
permissions:
  contents: read

jobs:
  deprecate-release:
    uses: ./.github/workflows/reusable-release-pr.yml
    with:
      branch: deprecate-${{ inputs.release }}
      title: Deprecate ${{ inputs.release }}
      body: Deprecate ${{ inputs.release }} since ${{ inputs.date }}, use ${{ inputs.use_instead }} instead.
      recipes: deprecate ${{ inputs.release }} ${{ inputs.date }} ${{ inputs.use_instead }}
    secrets: inherit
