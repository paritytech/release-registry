# Manually triggered workflow that plans a new stable release:
# runs `just plan <release> <cutoff-date> <node_version>` and
# `just backfill <release> <first-patch-date>` and opens a PR with the
# regenerated files.

name: Plan release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release name (e.g. stable2606)'
        required: true
        type: string
      node_version:
        description: 'Node version (e.g. 1.25.0)'
        required: true
        type: string
      cutoff-date:
        description: 'Release cutoff date (YYYY-MM-DD) should be 1.5 months earlier than release date'
        required: true
        type: string
      first-patch-date:
        description: 'First patch release date (YYYY-MM-DD, must be a Monday) should be approx. 1 month after release date in a week where no releases are planned'
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan-release:
    uses: ./.github/workflows/reusable-release-pr.yml
    with:
      branch: plan-${{ inputs.release }}
      title: Plan ${{ inputs.release }}
      body: Plan and backfill for ${{ inputs.release }} with node version ${{ inputs.node_version }} and cutoff date ${{ inputs.cutoff-date }} and first patch date ${{ inputs.first-patch-date }}
      recipes: |
        plan ${{ inputs.release }} ${{ inputs.cutoff-date }} ${{ inputs.node_version }}
        backfill ${{ inputs.release }} ${{ inputs.first-patch-date }}
    secrets: inherit
