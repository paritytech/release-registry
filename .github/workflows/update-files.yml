# CI check that runs every time a PR is updated: it regenerates all derived
# files with `just` and fails if the result differs from what is committed.

name: Update Files

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # The job id is the status-check context required by the ruleset on main; do not rename it.
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain

      - name: All files
        run: just

      - name: Check that the derived files are up to date
        run: |
          # `git status` rather than `git diff`, so new, untracked outputs fail the check too.
          CHANGES="$(git status --porcelain -- . ':!.assets/timeline-gantt.png')"
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            echo "::error::Derived files are out of date. Run 'just' locally, then commit the result (commits must be signed) and push."
            exit 1
          fi
